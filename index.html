<!doctype html>
<html lang="en">
  <head>
    <script type="module">
      import RefreshRuntime from "/@react-refresh"
      RefreshRuntime.injectIntoGlobalHook(window)
      window.$RefreshReg$ = () => {}
      window.$RefreshSig$ = () => (type) => type
      window.__vite_plugin_react_preamble_installed__ = true
    </script>
    <script>
      (function() {
        function checkAndPolyfill(storageName) {
          try {
            var storage = window[storageName];
            var testKey = '__test_storage_access_v1__';
            storage.setItem(testKey, 'ok');
            storage.removeItem(testKey);
          } catch (e) {
            console.warn("[Storage-Polyfill] " + storageName + " is blocked. Injecting memory-based fallback.", e);
            var memoryStore = {};
            var storageMock = {
              getItem: function(key) {
                return key in memoryStore ? memoryStore[key] : null;
              },
              setItem: function(key, value) {
                memoryStore[key] = String(value);
              },
              removeItem: function(key) {
                delete memoryStore[key];
              },
              clear: function() {
                memoryStore = {};
              },
              key: function(index) {
                var keys = Object.keys(memoryStore);
                return keys[index] || null;
              },
              get length() {
                return Object.keys(memoryStore).length;
              }
            };
            try {
              Object.defineProperty(window, storageName, {
                value: storageMock,
                writable: true,
                configurable: true
              });
              console.log("[Storage-Polyfill] Successfully polyfilled " + storageName);
            } catch (err) {
              console.error("[Storage-Polyfill] Failed to polyfill " + storageName, err);
            }
          }
        }
        checkAndPolyfill('localStorage');
        checkAndPolyfill('sessionStorage');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>AI Master Studio</title>
    <meta name="description" content="Developer-grade client-side AI studio, live web app previewer, source ZIP extractor, and 6-Section Secure Admin Panel with embedded Brahmastram AI Studio." />
    <meta property="og:title" content="AI Master Studio" />
    <meta property="og:description" content="Developer-grade client-side AI studio, live web app previewer, source ZIP extractor, and 6-Section Secure Admin Panel with embedded Brahmastram AI Studio." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="manifest" href="/manifest.json?v=2" />
  </head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #020617; flex-direction: column;">
        <div style="width: 4rem; height: 4rem; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="color: #818cf8; font-family: sans-serif; font-weight: bold; margin-top: 1rem; animation: pulse 2s infinite;">Initializing AI Master Engine...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } } @keyframes pulse { 50% { opacity: 0.5; } } body { margin: 0; background: #020617; }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Check for updates on every launch
            reg.update().catch(() => {});
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          }).catch((err) => {
            console.log('SW registration failed: ', err);
          });

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
